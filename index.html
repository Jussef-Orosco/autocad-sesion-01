<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCAD 3D - Sesión 01 (Cyberpunk + Interactivo)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="autocad-mini.js"></script>
    <style>
        /* ===== ESTILOS GLOBALES CYBERPUNK ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #e0e0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #presentation-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            padding: 88px 40px 90px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.05);
            overflow-y: auto;
        }
        .slide.active {
            display: flex;
            flex-direction: column;
        }
        /* Contenido: layout 2 columnas (texto | simulador) */
        .slide-layout {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
            width: 100%;
            flex: 1;
            min-height: 0;
            padding: 0;
        }
        .left-column {
            flex: 1 1 50%;
            max-width: 50%;
            z-index: 2;
            position: relative;
            min-width: 0;
            padding-right: 1rem;
        }
        .right-column {
            flex: 1 1 46%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-end;
            height: calc(100vh - 180px);
            min-height: 0;
            pointer-events: none;
        }
        .slide-content {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .slide-title {
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00f0ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,240,255,0.3);
            margin-bottom: 15px;
            animation: glitch 3s infinite;
        }
        .slide-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #c0d0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.1);
            margin-bottom: 20px;
        }
        .slide-text p {
            margin-bottom: 12px;
        }
        /* ===== ELEMENTOS INTERACTIVOS CYBERPUNK ===== */
        /* Tooltip flotante */
        .tooltip-cyber {
            display: inline-block;
            position: relative;
            cursor: help;
            color: #00f0ff;
            font-weight: bold;
            border-bottom: 2px dashed #00f0ff;
        }
        .tooltip-cyber .tooltip-content {
            visibility: hidden;
            opacity: 0;
            width: 280px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 12px 16px;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            transition: opacity 0.3s, visibility 0.3s;
            box-shadow: 0 0 30px rgba(0,240,255,0.2);
            z-index: 100;
            color: #c0d0ff;
            font-weight: normal;
            font-size: 0.9rem;
            text-align: left;
        }
        .tooltip-cyber .tooltip-content p {
            margin: 4px 0;
        }
        .tooltip-cyber:hover .tooltip-content {
            visibility: visible;
            opacity: 1;
        }
        /* Terminal flotante */
        .terminal-popup {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
            margin: 15px 0;
            max-width: 500px;
        }
        .terminal-popup .terminal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: #888;
        }
        .terminal-popup .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: #ff4444; }
        .dot.yellow { background: #ffdd44; }
        .dot.green { background: #44ff44; }
        .terminal-popup .typing-text {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 2s steps(40) infinite;
            border-right: 2px solid #00ff41;
            margin: 4px 0;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        .blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* Botón cyberpunk */
        .cyber-button {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin: 10px 0;
            border-radius: 4px;
        }
        .cyber-button:hover {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }
        .cyber-button .button-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,240,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .cyber-button:hover .button-glow {
            opacity: 1;
        }
        /* Tarjetas flotantes */
        .floating-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .card-cyber {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid #9b59b6;
            border-radius: 12px;
            padding: 20px 25px;
            transition: all 0.3s ease;
            cursor: default;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        .card-cyber:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
            border-color: #00f0ff;
        }
        .card-cyber .card-icon { font-size: 2.5rem; }
        .card-cyber h3 { color: #00f0ff; margin: 8px 0; }
        .card-cyber .card-progress {
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .card-cyber .card-progress span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #ff00ff);
            width: 0%;
            transition: width 1s;
        }
        /* Holograma */
        .hologram-container {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 2rem;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
        .hologram-rotate {
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        /* Feature grid */
        .feature-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .feature-item {
            background: rgba(0,240,255,0.05);
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
            flex: 1;
            min-width: 120px;
            transition: all 0.3s;
            position: relative;
        }
        .feature-item:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }
        .feature-item .feature-number {
            font-size: 2rem;
            color: #ff00ff;
        }
        .feature-item .feature-title {
            display: block;
            font-weight: bold;
            color: #00f0ff;
        }
        /* Timeline */
        .timeline-cyber {
            display: flex;
            gap: 30px;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            flex-wrap: wrap;
        }
        .timeline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .timeline-item:hover { background: rgba(0,240,255,0.05); }
        .timeline-item .timeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00f0ff;
            margin-bottom: 8px;
            box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
        .timeline-item .timeline-content h4 { color: #ff00ff; }
        /* Contador animado */
        .counter-cyber {
            background: rgba(0,240,255,0.05);
            border: 1px solid #00f0ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }
        .counter-number {
            font-size: 4rem;
            color: #00f0ff;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0,240,255,0.3);
        }
        .counter-label { font-size: 1.2rem; color: #ff00ff; }
        /* Skills tree */
        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 15px 0;
        }
        .skill-node {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 18px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border-left: 4px solid #00f0ff;
        }
        .skill-node.locked { border-left-color: #666; opacity: 0.6; }
        .skill-node .skill-icon { font-size: 1.8rem; }
        .skill-node .skill-name { font-weight: bold; color: #00f0ff; }
        .skill-node .skill-status { margin-left: auto; font-size: 0.9rem; }
        /* Objetivos */
        .objectives-container {
            margin: 15px 0;
        }
        .objective-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .objective-item .objective-check {
            font-size: 1.5rem;
            color: #888;
        }
        .objective-item .objective-text {
            flex: 1;
        }
        .objective-item .objective-progress {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 4px;
        }
        .objective-item .objective-progress div {
            height: 100%;
            background: #00f0ff;
            width: 0%;
        }
        .mini-btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .mini-btn:hover { background: #00f0ff; color: #000; }
        /* Otros */
        .floating-menu {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .menu-item {
            background: rgba(0,240,255,0.03);
            border: 1px solid rgba(0,240,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-item:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0,240,255,0.1);
        }
        .menu-item .menu-number { color: #ff00ff; font-weight: bold; }
        .concept-map {
            position: relative;
            height: 200px;
            margin: 15px 0;
            border: 1px dashed rgba(0,240,255,0.2);
            border-radius: 12px;
        }
        .map-node {
            position: absolute;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0,240,255,0.05);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            cursor: pointer;
            transition: 0.3s;
        }
        .map-node:hover {
            background: rgba(0,240,255,0.15);
            box-shadow: 0 0 30px rgba(0,240,255,0.2);
        }
        .map-node.center {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(0,240,255,0.15);
        }
        /* etc. */

        /* Contenedor derecho: Mini AutoCAD arriba + 3D abajo libre */
        .right-stack {
            position: absolute;
            top: 64px;
            right: 24px;
            width: 46% !important;
            max-width: none;
            height: calc(100vh - 180px);
            bottom: auto;
            z-index: 8;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 0.5rem;
            pointer-events: none;
            margin-left: auto;
            padding-right: 4px;
        }
        .right-stack > * {
            pointer-events: auto;
        }
        /* Mini AutoCAD — un poco más estrecho, sin pegarse al texto */
        .mini-autocad-container,
        .acad-mini,
        .autocad-mini-window,
        #mini-autocad-container {
            width: 100% !important;
            height: 58vh;
            max-height: 520px;
            flex: 0 0 auto;
            min-height: 220px;
            margin-left: auto;
            background: rgba(10, 15, 25, 0.70);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }
        .mini-autocad-container canvas,
        .mini-autocad-container svg,
        .acad-mini canvas,
        .acad-mini svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
            object-fit: fill;
            display: block;
        }
        /* El canvas del Mini CAD se dimensiona por JS; no usar tamaño intrínseco del <canvas> */
        .acad-mini .acad-viewport canvas,
        .mini-autocad-container .acad-viewport canvas {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
        }
        /* Objeto 3D — completo, flotante, sin recortes */
        .three-container,
        .objeto-3d-container,
        #canvas-3d-container,
        .model-3d-viewer,
        .viewer-3d-wrapper {
            position: fixed !important;
            bottom: -30px !important;
            right: 8px !important;
            left: auto !important;
            top: auto !important;
            width: 560px !important;
            height: 560px !important;
            max-width: min(560px, 48vw) !important;
            max-height: min(560px, calc(100vh - 24px)) !important;
            min-height: 0 !important;
            aspect-ratio: 1 / 1;
            flex: none;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s;
            z-index: 99990 !important;
            border: none !important;
            border-radius: 0 !important;
            overflow: visible !important;
            clip-path: none !important;
            contain: none !important;
            background: transparent !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .three-container.active-3d,
        .objeto-3d-container.active-3d {
            opacity: 1;
            pointer-events: none;
        }
        .three-container canvas,
        #canvas-3d-container canvas,
        .model-3d-viewer canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            pointer-events: auto;
            overflow: visible !important;
            background: transparent !important;
        }
        /* Ocultar botón 3D ON */
        .btn-3d,
        #btn3D,
        #btn-3d-on,
        .btn-3d-toggle {
            display: none !important;
        }
        /* Navegación: PREV · NEXT · nº · IR */
        .nav-controls,
        .nav-controls-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100001;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            background: rgba(255, 0, 255, 0.05);
        }
        .nav-btn:hover {
            background: #ff00ff;
            color: #0a0a0f;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }
        .slide-input,
        .nav-controls #gotoInput,
        .nav-controls-left #gotoInput {
            width: 50px;
            text-align: center;
            background: transparent;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }
        .go-btn,
        .nav-controls #btnGoto,
        .nav-controls-left #btnGoto {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        .go-btn:hover,
        .nav-controls #btnGoto:hover,
        .nav-controls-left #btnGoto:hover {
            background: #00f0ff;
            color: #000;
        }
        .goto-box { display: none !important; }
        .slide-counter {
            position: absolute;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* Efecto glitch */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
        }
        /* Scroll */
        .slide::-webkit-scrollbar {
            width: 6px;
        }
        .slide::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        .slide::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 3px;
        }
        @media (max-width: 768px) {
            .slide-content { max-width: 100%; }
            .slide-layout { flex-direction: column; gap: 1rem; }
            .left-column { max-width: 100%; flex: 1 1 auto; }
            .right-column { display: none; }
            .right-stack {
                position: relative;
                top: auto;
                right: auto;
                width: 100%;
                height: auto;
                max-width: none;
                bottom: auto;
                margin-top: 8px;
                order: 2;
            }
            .mini-autocad-container,
            .acad-mini {
                height: 42vh;
                max-height: 320px;
                min-height: 200px;
            }
            .three-container,
            .objeto-3d-container,
            #canvas-3d-container {
                position: fixed !important;
                bottom: -10px !important;
                right: 4px !important;
                width: 280px !important;
                height: 280px !important;
                max-width: 70vw !important;
                max-height: calc(100vh - 180px) !important;
                min-height: 0 !important;
                z-index: 99999 !important;
                overflow: visible !important;
            }
            .btn-3d {
                display: none !important;
            }
            .slide.active { display: flex; }
            .slide-title { font-size: 1.5rem; }
            .nav-controls,
            .nav-controls-left { bottom: 16px; left: 12px; gap: 8px; }
            .nav-btn { padding: 8px 12px; font-size: 0.8rem; }
            .slide-counter { bottom: 80px; }
        }
    </style>
    <style>
      /* Motor UI extras */
      .progress-bar-wrap {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: rgba(255,255,255,0.05); z-index: 30;
      }
      .progress-bar-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #00f0ff, #ff00ff);
        transition: width 0.25s ease;
        box-shadow: 0 0 10px rgba(0,240,255,0.5);
      }
      /* Branding institucional — visible en todas las diapositivas */
      .brand-header {
        position: absolute;
        top: 3px;
        left: 0;
        right: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 24px 10px;
        background: linear-gradient(180deg, rgba(8,8,12,0.95) 0%, rgba(8,8,12,0.75) 70%, transparent 100%);
        pointer-events: none;
      }
      .brand-logo {
        height: 48px;
        width: auto;
        max-width: 200px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(255, 0, 51, 0.65));
        flex-shrink: 0;
      }
      .brand-expositor {
        text-align: right;
        min-width: 0;
      }
      .brand-expositor .brand-label {
        display: block;
        font-size: 0.65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #c9a227;
        margin-bottom: 2px;
      }
      .brand-expositor .brand-name {
        display: block;
        font-size: 0.95rem;
        font-weight: bold;
        color: #e8e8ff;
        letter-spacing: 0.5px;
        line-height: 1.25;
      }
      .brand-expositor .brand-role {
        display: block;
        font-size: 0.75rem;
        color: #00f0ff;
        margin-top: 2px;
      }
      .brand-footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;

    <script>
    (function () {
      'use strict';

      const slidesData = [{"title":"SESIÓN 01 - AutoCAD 3","text":"\n  <p><strong>Bienvenidos a la primera sesión del curso de AutoCAD.</strong> En esta sesión introductoria exploraremos los fundamentos del software de diseño asistido por computadora más utilizado en el mundo. AutoCAD ha revolucionado la forma en que se crean planos, diseños técnicos y modelos, permitiendo a profesionales de la arquitectura, ingeniería y diseño materializar sus ideas con una precisión y velocidad sin precedentes.</p>\n  <p>A lo largo de esta presentación, aprenderemos desde el reconocimiento básico del entorno hasta el uso de comandos esenciales para dibujar figuras geométricas con exactitud. No importa si es tu primera vez con el programa; al finalizar esta sesión tendrás una base sólida para seguir avanzando.</p>\n  <div class=\"tooltip-cyber\"><span class=\"glitch-text\">AUTOCAD</span>\n    <div class=\"tooltip-content\"><p>Computer-Aided Design</p><p>Precisión milimétrica</p><p>Desde 1982</p></div>\n  </div>\n  <div class=\"terminal-popup\"><div class=\"terminal-header\"><span class=\"dot red\"></span><span class=\"dot yellow\"></span><span class=\"dot green\"></span><span>AUTOCAD_CMD</span></div><div class=\"terminal-body\"><p class=\"typing-text\">> Cargando módulos de dibujo...</p><p class=\"typing-text\">> Bienvenido a AutoCAD 2024</p><p class=\"typing-text\">> Listo para dibujar █</p></div></div>\n  <button class=\"cyber-button\" onclick=\"alert('¡Comienza tu viaje en AutoCAD!')\"><span class=\"button-text\">▶ INICIAR SESIÓN</span></button>\n  ","objectType":"cube","color":61695,"wireframe":false},{"title":"DESCRIPCIÓN GENERAL DEL CURSO","text":"\n  <p>El curso está diseñado para proporcionar un conocimiento sólido del entorno de AutoCAD y la aplicación de comandos de dibujo y edición. La modalidad semipresencial combina el aprendizaje autónomo con sesiones prácticas guiadas, lo que te permite avanzar a tu propio ritmo mientras recibes retroalimentación directa.</p>\n  <p>Al finalizar esta sesión, serás capaz de reconocer cada parte de la pantalla, configurar unidades de medida, dibujar líneas utilizando diferentes sistemas de coordenadas y manejar los modos de referencia que garantizan precisión en cada trazo. Estos conocimientos son la base para cualquier proyecto en AutoCAD.</p>\n  <div class=\"floating-cards\"><div class=\"card-cyber\"><div class=\"card-icon\">🎯</div><h3>PRECISIÓN</h3><p>Dibujos exactos al milímetro</p></div><div class=\"card-cyber\"><div class=\"card-icon\">⚡</div><h3>RAPIDEZ</h3><p>Herramientas optimizadas</p></div><div class=\"card-cyber\"><div class=\"card-icon\">🔄</div><h3>EDITABILIDAD</h3><p>Modificaciones sin redibujar</p></div></div>\n  <div class=\"hologram-container\"><span class=\"hologram-text\">AUTO</span><span class=\"hologram-text\">CAD</span><span class=\"hologram-rotate\">⟳</span></div>\n  ","objectType":"sphere","color":16711935,"wireframe":false},{"title":"¿QUÉ ES AUTOCAD?","text":"\n  <p><span class=\"tooltip-cyber\">AutoCAD<span class=\"tooltip-content\">Software de diseño asistido por computadora</span></span> es un programa desarrollado por Autodesk que permite crear dibujos en 2D y modelos en 3D con una precisión milimétrica. Su nombre proviene de \"Computer-Aided Design\" y desde su lanzamiento en 1982 se ha convertido en el estándar de la industria.</p>\n  <p>Lo que hace especial a AutoCAD es su capacidad para trabajar en cualquier unidad de medida, ya sea longitud o ángulos, y su área de dibujo ilimitada donde los objetos se crean a escala real, eliminando la necesidad de dibujar a escala reducida como se hacía tradicionalmente en papel.</p>\n  <div class=\"feature-grid\">\n    <div class=\"feature-item\"><span class=\"feature-number\">01</span><span class=\"feature-title\">PRECISIÓN</span><span class=\"feature-desc\">Milimétrica</span></div>\n    <div class=\"feature-item\"><span class=\"feature-number\">02</span><span class=\"feature-title\">RAPIDEZ</span><span class=\"feature-desc\">Eficiente</span></div>\n    <div class=\"feature-item\"><span class=\"feature-number\">03</span><span class=\"feature-title\">ESCALABILIDAD</span><span class=\"feature-desc\">Ilimitada</span></div>\n  </div>\n  <div class=\"timeline-cyber\">\n    <div class=\"timeline-item\"><div class=\"timeline-dot\"></div><div class=\"timeline-content\"><h4>1982</h4><p>Primera versión</p></div></div>\n    <div class=\"timeline-item\"><div class=\"timeline-dot\"></div><div class=\"timeline-content\"><h4>2000</h4><p>Interfaz mejorada</p></div></div>\n    <div class=\"timeline-item\"><div class=\"timeline-dot\"></div><div class=\"timeline-content\"><h4>2024</h4><p>IA integrada</p></div></div>\n  </div>\n  ","objectType":"torus","color":65345,"wireframe":false},{"title":"OBJETIVOS DE APRENDIZAJE","text":"\n  <p>Al completar esta sesión, usted será capaz de:</p>\n  <ul style=\"color:#c0d0ff;line-height:1.9;list-style:none;padding-left:0;\">\n    <li>✅ <strong>Reconocer</strong> el entorno completo de AutoCAD para ubicar rápidamente los comandos necesarios.</li>\n    <li>✅ <strong>Configurar</strong> las unidades de medida según el sistema métrico o inglés.</li>\n    <li>✅ <strong>Dibujar</strong> figuras geométricas utilizando líneas mediante distancias y coordenadas.</li>\n    <li>✅ <strong>Utilizar</strong> los modos de referencia para lograr precisión absoluta en los dibujos.</li>\n    <li>✅ <strong>Dibujar</strong> círculos indicando medidas o puntos de intersección.</li>\n    <li>✅ <strong>Crear</strong> puntos sobre figuras en partes iguales y distancias específicas.</li>\n    <li>✅ <strong>Generar</strong> desfases para repetir la misma figura en una distancia específica.</li>\n    <li>✅ <strong>Cortar y extender</strong> figuras teniendo en cuenta límites de intersección.</li>\n  </ul>\n  <div class=\"counter-cyber\"><div class=\"counter-number\">8</div><div class=\"counter-label\">OBJETIVOS</div><div class=\"counter-sublabel\">A alcanzar</div></div>\n  ","objectType":"cylinder","color":16768256,"wireframe":false},{"title":"CAPACIDAD DEL CURSO","text":"\n  <p>La capacidad principal que desarrollaremos es la habilidad para <strong>\"Aplicar comandos de dibujo y edición en AutoCAD\"</strong>. Esto significa que no solo aprenderemos teóricamente qué hace cada comando, sino que practicaremos su aplicación en ejercicios concretos.</p>\n  <p>La capacidad de aplicar comandos implica comprender <em>cuándo</em> y <em>cómo</em> utilizar cada herramienta para resolver problemas de dibujo específicos. Al finalizar, usted podrá tomar un diseño conceptual y convertirlo en un dibujo preciso utilizando las herramientas adecuadas de AutoCAD.</p>\n  <div class=\"skill-tree\">\n    <div class=\"skill-node unlocked\"><span class=\"skill-icon\">🏗️</span><span class=\"skill-name\">Dibujo Básico</span><span class=\"skill-status\">✓ Desbloqueado</span></div>\n    <div class=\"skill-node locked\"><span class=\"skill-icon\">📐</span><span class=\"skill-name\">Edición</span><span class=\"skill-status\">🔒 Bloqueado</span></div>\n    <div class=\"skill-node locked\"><span class=\"skill-icon\">🎯</span><span class=\"skill-name\">Precisión</span><span class=\"skill-status\">🔒 Bloqueado</span></div>\n  </div>\n  ","objectType":"cone","color":10181046,"wireframe":false},{"title":"TEMÁTICA DE LA SESIÓN","text":"\n  <p>La sesión está estructurada en los siguientes temas, cada uno con su propio enfoque práctico:</p>\n  <div class=\"floating-menu\"><div class=\"menu-item\" style=\"border-color:#00f0ff\"><span class=\"menu-number\">01</span> Entorno</div><div class=\"menu-item\" style=\"border-color:#ff00ff\"><span class=\"menu-number\">02</span> UNITS</div><div class=\"menu-item\" style=\"border-color:#00ff41\"><span class=\"menu-number\">03</span> LINE</div><div class=\"menu-item\" style=\"border-color:#ffdd00\"><span class=\"menu-number\">04</span> ZOOM</div><div class=\"menu-item\" style=\"border-color:#9b59b6\"><span class=\"menu-number\">05</span> PAN</div><div class=\"menu-item\" style=\"border-color:#00f0ff\"><span class=\"menu-number\">06</span> Coordenadas</div><div class=\"menu-item\" style=\"border-color:#ff00ff\"><span class=\"menu-number\">07</span> Referencias</div><div class=\"menu-item\" style=\"border-color:#00ff41\"><span class=\"menu-number\">08</span> ERASE / UNDO / REDO</div></div>\n  <p>Estos temas cubren desde la configuración inicial hasta las herramientas de corrección, proporcionando una base completa para el dibujo asistido por computadora.</p>\n  ","objectType":"torusKnot","color":61695,"wireframe":false},{"title":"IMPORTANCIA DEL RECONOCIMIENTO DEL ENTORNO","text":"\n  <p>Antes de comenzar a dibujar, es fundamental conocer el entorno de trabajo de AutoCAD. Así como un piloto debe conocer todos los instrumentos de su cabina antes de despegar, un diseñador debe familiarizarse con cada elemento de la interfaz.</p>\n  <p>El reconocimiento del entorno permite acceder rápidamente a los comandos más utilizados, personalizar el espacio de trabajo según las necesidades del proyecto, navegar eficientemente entre diferentes dibujos y aprovechar al máximo las herramientas disponibles, reduciendo significativamente el tiempo de ejecución de los diseños.</p>\n  <div style=\"display:flex;gap:20px;margin:15px 0;flex-wrap:wrap;\">\n    <div style=\"background:rgba(0,240,255,0.05);padding:15px;border-radius:8px;border-left:4px solid #00f0ff;flex:1;\"><strong>📌 CINTA DE OPCIONES</strong><p>Ribbon - Comandos agrupados por categorías</p></div>\n    <div style=\"background:rgba(255,0,255,0.05);padding:15px;border-radius:8px;border-left:4px solid #ff00ff;flex:1;\"><strong>📌 ESPACIO DE DIBUJO</strong><p>Donde se crean y editan los diseños</p></div>\n    <div style=\"background:rgba(0,255,65,0.05);padding:15px;border-radius:8px;border-left:4px solid #00ff41;flex:1;\"><strong>📌 BARRA DE ESTADO</strong><p>Modos de referencia y configuración</p></div>\n  </div>\n  ","objectType":"cube","color":16711935,"wireframe":true},{"title":"VENTAJAS DEL USO DE AUTOCAD","text":"\n  <p>AutoCAD ofrece numerosas ventajas que lo convierten en el estándar de la industria:</p>\n  <ul style=\"color:#c0d0ff;line-height:1.9;list-style:none;padding-left:0;\">\n    <li>🎯 <strong>Precisión:</strong> Los dibujos se crean con exactitud matemática, eliminando errores humanos.</li>\n    <li>⚡ <strong>Rapidez:</strong> Herramientas de edición y copia que permiten crear diseños complejos en minutos.</li>\n    <li>📐 <strong>Escalabilidad:</strong> Los dibujos se crean en tamaño real y se pueden escalar para impresión sin perder calidad.</li>\n    <li>🔄 <strong>Edición fácil:</strong> Modificar un diseño no requiere volver a dibujar todo el plano.</li>\n    <li>💾 <strong>Almacenamiento digital:</strong> Archivos .dwg compactos y fáciles de compartir.</li>\n    <li>👥 <strong>Colaboración:</strong> Varios diseñadores pueden trabajar en el mismo proyecto simultáneamente.</li>\n    <li>🧩 <strong>Reutilización:</strong> Los bloques y plantillas permiten no reinventar la rueda cada vez.</li>\n  </ul>\n  <div class=\"floating-cards\"><div class=\"card-cyber\"><div class=\"card-icon\">🎯</div><h3>PRECISIÓN</h3><p>Error cero</p></div><div class=\"card-cyber\"><div class=\"card-icon\">⚡</div><h3>RAPIDEZ</h3><p>Herramientas eficientes</p></div><div class=\"card-cyber\"><div class=\"card-icon\">📦</div><h3>ESCALABILIDAD</h3><p>Tamaño real</p></div><div class=\"card-cyber\"><div class=\"card-icon\">🔄</div><h3>REUTILIZACIÓN</h3><p>Bloques y plantillas</p></div></div>\n  ","objectType":"sphere","color":65345,"wireframe":true},{"title":"METODOLOGÍA DE APRENDIZAJE","text":"\n  <p>Esta sesión sigue una metodología práctica y gradual. Comenzaremos con la teoría y descripción del entorno, luego pasaremos a ejercicios guiados paso a paso. Es importante que:</p>\n  <ul style=\"color:#c0d0ff;line-height:1.9;\">\n    <li>Sigas la presentación en orden, ya que cada concepto se construye sobre el anterior.</li>\n    <li>Practiques cada comando inmediatamente después de conocerlo.</li>\n    <li>No temas cometer errores: el comando UNDO está para eso.</li>\n    <li>Tomes notas de los atajos de teclado y consejos que se proporcionen.</li>\n    <li>Hagas todas las preguntas que tengas; no hay preguntas tontas en el aprendizaje.</li>\n  </ul>\n  <div class=\"floating-menu\"><div class=\"menu-item\" style=\"border-color:#00f0ff\"><span class=\"menu-number\">01</span> TEORÍA</div><div class=\"menu-item\" style=\"border-color:#ff00ff\"><span class=\"menu-number\">02</span> DEMOSTRACIÓN</div><div class=\"menu-item\" style=\"border-color:#00ff41\"><span class=\"menu-number\">03</span> PRÁCTICA</div><div class=\"menu-item\" style=\"border-color:#ffdd00\"><span class=\"menu-number\">04</span> EVALUACIÓN</div></div>\n  <div style=\"display:flex;align-items:center;gap:15px;background:rgba(0,240,255,0.03);padding:12px;border-radius:8px;\">\n    <span style=\"font-size:2rem;\">⏱️</span><span style=\"font-size:2rem;color:#00f0ff;\">15:00</span><span style=\"color:#888;\">Tiempo estimado de práctica</span>\n  </div>\n  ","objectType":"torus","color":16768256,"wireframe":true},{"title":"ESTRUCTURA DE LAS DIAPOSITIVAS","text":"\n  <p>Para facilitar el aprendizaje, esta presentación está organizada con:</p>\n  <ul style=\"color:#c0d0ff;line-height:1.9;\">\n    <li><strong>Títulos claros</strong> que indican el tema principal.</li>\n    <li><strong>Texto narrativo</strong> que explica los conceptos en detalle.</li>\n    <li><strong>Instrucciones paso a paso</strong> para realizar las acciones.</li>\n    <li><strong>Consejos y atajos</strong> que aceleran el trabajo.</li>\n    <li><strong>Ejercicios prácticos</strong> para aplicar lo aprendido.</li>\n    <li><strong>Imágenes y simulaciones 3D</strong> que ilustran los conceptos.</li>\n    <li><strong>Resúmenes</strong> al final de cada sección para consolidar el conocimiento.</li>\n  </ul>\n  <div style=\"display:flex;gap:20px;margin:15px 0;flex-wrap:wrap;\">\n    <div style=\"border-left:3px solid #00f0ff;padding-left:12px;\">✦ Introducción</div>\n    <div style=\"border-left:3px solid #ff00ff;padding-left:12px;\">✦ Entorno</div>\n    <div style=\"border-left:3px solid #00ff41;padding-left:12px;\">✦ Comandos</div>\n    <div style=\"border-left:3px solid #ffdd00;padding-left:12px;\">✦ Práctica</div>\n    <div style=\"border-left:3px solid #9b59b6;padding-left:12px;\">✦ Resumen</div>\n  </div>\n  ","objectType":"cylinder","color":10181046,"wireframe":true},{"title":"CÓMO INICIAR AUTOCAD","text":"<p><strong>Doble clic en el icono de AutoCAD en el escritorio o menú de inicio. Esperar la pantalla de bienvenida.</strong></p><p>En esta diapositiva profundizamos en <strong>CÓMO INICIAR AUTOCAD</strong>. Comprender este tema es esencial para dominar AutoCAD y aplicarlo con seguridad en proyectos de arquitectura, ingeniería y expresión gráfica. Cada concepto se conecta con los siguientes: configuración, dibujo, precisión y corrección.</p><p>El arranque correcto del programa evita errores posteriores. Usa siempre una plantilla adecuada (preferible <strong>ACADISO</strong> en milímetros), organiza tu carpeta de proyectos y verifica que mouse, teclado y espacio de trabajo estén listos antes de dibujar.</p><div style=\"background:rgba(0,240,255,0.03);padding:10px 14px;border-radius:8px;border-left:4px solid #00f0ff;margin:12px 0;\"><strong style=\"color:#00f0ff;\">💡 Consejo:</strong> Guarda con nombres claros desde el primer minuto: Proyecto_Sesion01_TuNombre.dwg</div><p><span class=\"tooltip-cyber\">CÓMO INICIAR AUTOCAD<span class=\"tooltip-content\">Tema clave de la Sesión 01 — AutoCAD / Expresión Gráfica</span></span> forma parte del recorrido completo hacia un dibujo técnico confiable y profesional.</p>","objectType":"cube","color":61695,"wireframe":false},{"title":"PANTALLA DE BIENVENIDA","text":"<p><strong>Tres áreas: Start Drawing, Recent Documents y Connect.</strong></p><p>En esta diapositiva profundizamos en <strong>PANTALLA DE BIENVENIDA</strong>. Compr ujo, precisión y corrección.</p><p>Consolida lo aprendido: entorno, UNITS, LINE, ZOOM/PAN, coordenadas, selección, modos de referencia y corrección (ERASE/UNDO/REDO). La precisión profesional nace de hábitos: plantilla correcta, Osnap/Ortho cuando corresponda, y verificar con DIST.</p><div style=\"background:rgba(0,240,255,0.03);padding:10px 14px;border-radius:8px;border-left:4px solid #00f0ff;margin:12px 0;\"><strong style=\"color:#00f0ff;\">💡 Consejo:</strong> Practica 15–30 minutos diarios. La memoria muscular de los alias (L, C, E, M, Z, P) acelera tu flujo.</div><p><span class=\"tooltip-cyber\">RESUMEN MODOS<span class=\"tooltip-content\">Tema clave de la Sesión 01 — AutoCAD / Expresión Gráfica</span></span> forma parte del recorrido completo hacia un dibujo técnico confiable y profesional.</p>","objectType":"cylinder","color":16768256,"wireframe":true},{"title":"COMANDO ERASE","text":"<p><strong>Borra objetos seleccionados. Icono borrador.</strong></p><p>En esta diapositiva profundizamos en <strong>COMANDO ERASE</strong>. Comprender este tema es esencial para dominar AutoCAD y aplicarlo con seguridad en proyectos de arquitectura, ingeniería y expresión gráfica. Cada concepto se conecta con los siguientes: configuración, dibujo, precisión y corrección.</p><p><strong>ERASE (E)</strong> elimina objetos seleccionados. <strong>UNDO (CTRL+Z)</strong> deshace la última acción (o varias). <strong>REDO (CTRL+Y)</strong> rehace lo deshecho. No son lo mismo: borrar un objeto ≠ deshacer un comando completo de edición.</p><ol style=\"margin:12px 0 12px 22px;line-height:1.9;color:#c0d0ff;\"><li>Selecciona objetos (Window/Crossing)</li><li>E + Enter o tecla Suprimir</li><li>Si te equivocas: CTRL+Z</li><li>Si deshaces de más: CTRL+Y</li></ol><div style=\"background:rgba(0,240,255,0.03);padding:10px 14px;border-radius:8px;border-left:4px solid #00f0ff;margin:12px 0;\"><strong style=\"color:#00f0ff;\">💡 Consejo:</strong> Guarda una versión antes de limpiezas masivas o experimen ad en proyectos de arquitectura, ingeniería y expresión gráfica. Cada concepto se conecta con los siguientes: configuración, dibujo, precisión y corrección.</p><p>Los modos de la Status Bar aportan precisión: <strong>GRID (F7)</strong> guía visual, <strong>SNAP (F9)</strong> salta el cursor, <strong>ORTHO (F8)</strong> fuerza H/V, <strong>POLAR (F10)</strong> guías angulares, <strong>OTRACK (F11)</strong> rastreo, <strong>DYNAMIC (F12)</strong> entrada junto al cursor.</p><p>Úsalos en combinación según la tarea: Ortho para planos ortogonales, Polar para ángulos regulares, Snap para incrementos, Dynamic para teclear distancias sin mirar la línea de comandos.</p><div style=\"background:rgba(0,240,255,0.03);padding:10px 14px;border-radius:8px;border-left:4px solid #00f0ff;margin:12px 0;\"><strong style=\"color:#00f0ff;\">💡 Consejo:</strong> Azul en el icono = modo activo. Clic derecho en el icono → Settings para configurarlo.</div><p><span class=\"tooltip-cyber\">MODOS DE REFERENCIA APRENDIDOS<span class=\"tooltip-content\">Tema clave de la Sesión 01 — AutoCAD / Expresión Gráfica</span></span> forma parte del recorrido completo hacia un dibujo técnico confiable y profesional.</p>","objectType":"torusKnot","color":16739125,"wireframe":true},{"title":"SISTEMAS DE COORDENADAS - CIERRE","text":"<p><strong>Cartesianas y Polares, Absolutas y Relativas.</strong></p><p>En esta diapositiva profundizamos en <strong>SISTEMAS DE COORDENADAS - CIERRE</strong>. Comprender este tema es esencial para dominar AutoCAD y aplicarlo con seguridad en proyectos de arquitectura, ingeniería y expresión gráfica. Cada concepto se conecta con los siguientes: configuración, dibujo, precisión y corrección.</p><p>AutoCAD interpreta puntos en el plano: <strong>absolutas</strong> respecto al origen (X,Y), <strong>relativas</strong> con @ΔX,ΔY, y <strong>polares</strong> con @distancia&lt;ángulo. El origen (0,0) y el UCS definen la orientación de ejes.</p><p>Ejemplos: <code style=\"color:#00f0ff\">100,       // ========== TOOLTIPS ==========
      function addTooltips(html) {
        const keywords = {
          'AutoCAD': 'Software CAD de Autodesk',
          'UNITS': 'Configura unidades de medida',
          'LINE': 'Comando para dibujar líneas',
          'ZOOM': 'Acercar/alejar vista',
          'PAN': 'Desplazar vista',
          'ERASE': 'Borrar objetos',
          'UNDO': 'Deshacer acción',
          'REDO': 'Rehacer acción',
          'GRID': 'Rejilla de referencia',
          'SNAP': 'Forzado de cursor',
          'ORTHO': 'Restricción ortogonal',
          'POLAR': 'Rastreo angular',
          'OSNAP': 'Referencias a objetos',
          'UCS': 'Sistema de coordenadas de usuario'
        };
        let result = html;
        for (const [key, value] of Object.entries(keywords)) {
          const regex = new RegExp('\\b(' + key + ')\\b(?![^<]*>)', 'g');
          result = result.replace(regex,
            '<span class="tooltip-cyber">$1<span class="tooltip-content">' + value + '</span></span>');
        }
        return result;
      }

      // ========== THREE.JS ==========
      let scene, camera, renderer, currentMesh, animId;
      let mode3D = true;
      let btn3D = null;
      let miniCad = null;
      const rightStack = document.createElement('div');
      rightStack.className = 'right-stack';
      rightStack.id = 'rightStack';
      const threeContainer = document.createElement('div');
      threeContainer.className = 'three-container objeto-3d-container model-3d-viewer viewer-3d-wrapper active-3d';
      threeContainer.id = 'canvas-3d-container';

      const SIZE_3D = 560;

      function fitCamera() {
        if (!camera) return;
        // Cámara centrada y alejada para que el objeto orbitando no se corte
        camera.position.set(0, 0.15, 5.8);
        camera.lookAt(0, 0, 0);
        camera.near = 0.1;
        camera.far = 100;
        camera.fov = 40;
        camera.updateProjectionMatrix();
      }

      function syncRendererSize() {
        if (!renderer || !camera || !threeContainer) return;
        const rect = threeContainer.getBoundingClientRect();
        const w = Math.max(180, Math.floor(rect.width || SIZE_3D));
        const h = Math.max(180, Math.floor(rect.height || SIZE_3D));
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
      }

      function initThree() {
        const w = SIZE_3D;
        const h = SIZE_3D;
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
        fitCamera();
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        renderer.domElement.style.display = 'block';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        threeContainer.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x404060, 0.85);
        scene.add(ambient);
        const dir = new THREE.DirectionalLight(0x00f0ff, 0.95);
        dir.position.set(5, 5, 5);
        scene.add(dir);
        const point = new THREE.PointLight(0xff00ff, 0.55);
        point.position.set(-3, 2, 2);
        scene.add(point);

        window.addEventListener('resize', onResize);
        animate();
        requestAnimationFrame(syncRendererSize);
      }

      function onResize() {
        if (!renderer || !camera) return;
        fitCamera();
        syncRendererSize();
        if (miniCad) miniCad.resize();
      }

      function createGeometry(type) {
        switch (type) {
          case 'sphere': return new THREE.SphereGeometry(1, 32, 32);
          case 'torus': return new THREE.TorusGeometry(0.8, 0.3, 16, 48);
          case 'cylinder': return new THREE.CylinderGeometry(0.7, 0.7, 1.4, 32);
          case 'cone': return new THREE.ConeGeometry(0.9, 1.6, 32);
          case 'torusKnot': return new THREE.TorusKnotGeometry(0.7, 0.22, 100, 16);
          default: return new THREE.BoxGeometry(1.4, 1.4, 1.4);
        }
      }

      function disposeObject3D(obj) {
        if (!obj) return;
        obj.traverse(function (child) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
            else child.material.dispose();
          }
        });
      }

      function setSlideObject(data) {
        if (!scene) return;
        data = data || {};
        if (currentMesh) {
          scene.remove(currentMesh);
          disposeObject3D(currentMesh);
          currentMesh = null;
        }
        try {
          const geo = createGeometry(data.objectType || 'cube');
          const color = data.color != null ? data.color : 0x00f0ff;
          const mat = new THREE.MeshStandardMaterial({
            color: color,
            wireframe: !!data.wireframe,
            metalness: 0.4,
            roughness: 0.35,
            emissive: color,
            emissiveIntensity: 0.15,
            transparent: true,
            opacity: 0.92
          });
          currentMesh = new THREE.Mesh(geo, mat);
          currentMesh.scale.set(0.92, 0.92, 0.92);
          scene.add(currentMesh);

          if (!data.wireframe) {
            const wire = new THREE.LineSegments(
              new THREE.EdgesGeometry(geo),
              new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
            );
            currentMesh.add(wire);
          }
        } catch (err) {
          console.warn('setSlideObject:', err);
          currentMesh = null;
        }
      }

      function animate() {
        animId = requestAnimationFrame(animate);
        if (document.hidden) return;
        if (currentMesh) {
          currentMesh.rotation.x += 0.006;
          currentMesh.rotation.y += 0.014;
          currentMesh.position.y = Math.sin(performance.now() * 0.0012) * 0.08;
        }
        if (renderer && scene && camera && mode3D) renderer.render(scene, camera);
      }

      function toggle3D() {
        // 3D permanece siempre visible; solo reajusta tamaño
        mode3D = true;
        threeContainer.classList.add('active-3d');
        threeContainer.style.display = '';
        onResize();
      }

      // ========== RENDER SLIDES ==========
      let current = 0;
      const container = document.getElementById('presentation-container');
      const slideEls = [];

      function buildUI() {
        if (window.MiniAutoCAD) {
          miniCad = window.MiniAutoCAD.create(rightStack);
        } else {
          const fallback = document.createElement('div');
          fallback.className = 'acad-mini';
          fallback.innerHTML = '<div class="acad-hint">No se cargó autocad-mini.js</div>';
          rightStack.appendChild(fallback);
        }
        // threeContainer en body: flota por encima de todo, sin recortes del layout
        container.appendChild(rightStack);
        document.body.appendChild(threeContainer);

        slidesData.forEach((data, i) => {
          const slide = document.createElement('div');
          slide.className = 'slide' + (i === 0 ? ' active' : '');
          slide.dataset.index = i;
          slide.innerHTML =
            '<div class="slide-layout">' +
              '<div class="left-column">' +
                '<div class="slide-content">' +
                  '<h1 class="slide-title">' + data.title + '</h1>' +
                  '<div class="slide-text">' + addTooltips(data.text) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="right-column" aria-hidden="true"></div>' +
            '</div>';
          container.appendChild(slide);
          slideEls.push(slide);
        });

        const nav = document.createElement('div');
        nav.className = 'nav-controls nav-controls-left';
        nav.innerHTML =
          '<button class="nav-btn" id="btnPrev">◀ PREV</button>' +
          '<button class="nav-btn" id="btnNext">NEXT ▶</button>' +
          '<input type="number" id="gotoInput" class="slide-input" min="1" max="' + slidesData.length + '" value="1" title="Número de diapositiva">' +
          '<button id="btnGoto" class="go-btn">IR</button>';
        container.appendChild(nav);

        const counter = document.createElement('div');
        counter.className = 'slide-counter';
        counter.id = 'slideCounter';
        container.appendChild(counter);

        document.getElementById('btnPrev').addEventListener('click', prev);
        document.getElementById('btnNext').addEventListener('click', next);
        document.getElementById('btnGoto').addEventListener('click', doGoto);
        document.getElementById('gotoInput').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            doGoto();
          }
        });
      }

      function el(id) { return document.getElementById(id); }

      function doGoto() {
        const input = el('gotoInput');
        if (!input) return;
        const n = parseInt(input.value, 10);
        if (!isNaN(n) && n >= 1 && n <= slidesData.length) goTo(n - 1);
      }

      function updateUI() {
        const counter = el('slideCounter');
        const bar = el('progressBar');
        const input = el('gotoInput');
        if (counter) counter.textContent = (current + 1) + ' / ' + slidesData.length;
        if (bar) bar.style.width = ((current + 1) / slidesData.length * 100) + '%';
        if (input) input.value = current + 1;
      }

      function goTo(index) {
        if (index < 0 || index >= slidesData.length) return;
        if (!slideEls[current] || !slideEls[index]) return;
        try {
          slideEls[current].classList.remove('active');
          current = index;
          slideEls[current].classList.add('active');
          slideEls[current].scrollTop = 0;
          setSlideObject(slidesData[current]);
          if (miniCad) miniCad.setContext(slidesData[current].title);
          updateUI();
        } catch (err) {
          console.warn('goTo:', err);
        }
      }

      function next() { if (current < slidesData.length - 1) goTo(current + 1); }
      function prev() { if (current > 0) goTo(current - 1); }

      function eventFromUiChrome(target) {
        if (!target || !target.closest) return false;
        return !!(target.closest('.acad-mini') || target.closest('#canvas-3d-container') || target.closest('.nav-controls'));
      }

      document.addEventListener('keydown', function (e) {
        const tag = (e.target && e.target.tagName) || '';
        if (miniCad && typeof miniCad.isCapturingKeys === 'function' && miniCad.isCapturingKeys()) {
          if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') return;
          if (e.key === 'F3' || e.key === 'F7' || e.key === 'F8' || e.key === 'F9' || e.key === 'F10' || e.key === 'F12') return;
          if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z' || e.key === 'y' || e.key === 'Y')) return;
        }
        if (tag === 'INPUT' || tag === 'TEXTAREA') {
          if (e.key === 'Escape') e.target.blur();
          return;
        }
        switch (e.key) {
          case 'ArrowRight':
          case 'PageDown':
            e.preventDefault();
            next();
            break;
          case ' ':
            e.preventDefault();
            next();
            break;
          case 'ArrowLeft':
          case 'PageUp':
            e.preventDefault();
            prev();
            break;
          case 'Home':
            e.preventDefault();
            goTo(0);
            break;
          case 'End':
            e.preventDefault();
            goTo(slidesData.length - 1);
            break;
          case 'g':
          case 'G':
            if (el('gotoInput')) {
              el('gotoInput').focus();
              el('gotoInput').select();
            }
            break;
        }
      });

      // Touch swipe (ignora gestos sobre Mini CAD / 3D / nav)
      let touchX = null;
      document.addEventListener('touchstart', function (e) {
        if (eventFromUiChrome(e.target)) { touchX = null; return; }
        touchX = e.changedTouches[0].screenX;
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (touchX === null) return;
        if (eventFromUiChrome(e.target)) { touchX = null; return; }
        const dx = e.changedTouches[0].screenX - touchX;
        if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
        touchX = null;
      }, { passive: true });

      // Boot
      function boot() {
        try {
          if (typeof THREE === 'undefined') {
            container.innerHTML = '<div style="color:#ff00ff;padding:40px;font-family:monospace;">Error: Three.js no cargó. Revisa tu conexión a internet.</div>';
            return;
          }
          if (!slidesData || !slidesData.length) {
            container.innerHTML = '<div style="color:#ff00ff;padding:40px;font-family:monospace;">Error: no hay diapositivas.</div>';
            return;
          }
          buildUI();
          initThree();
          setSlideObject(slidesData[0]);
          if (miniCad) miniCad.setContext(slidesData[0].title);
          updateUI();
          mode3D = true;
          threeContainer.classList.add('active-3d');
          setTimeout(function () {
            try {
              if (miniCad) miniCad.resize();
              onResize();
            } catch (e) { /* ignore */ }
          }, 80);
          setTimeout(onResize, 300);
        } catch (err) {
          console.error('boot:', err);
          container.innerHTML = '<div style="color:#ff00ff;padding:40px;font-family:monospace;">Error al iniciar la presentación.</div>';
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
    </script>
</body>
</html>
